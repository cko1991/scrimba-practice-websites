<!doctype html>
<html>
  <head>
    <title>Oldagram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header class="page-width">
      <img class="app-icon" src="images/logo.png" />
      <img class="profile-icon" src="images/user-avatar.png" />
    </header>
    
      <div class="page-width">
        <section class="post-header">
          <img class="profile-icon" src="images/avatar-vangogh.jpg" />
          <div>
            <p class="profile-name">Vincent van Gogh</p>
            <p class="profile-location">Zudert, Netherlands</p>
          </div>
        </section>
        <img class="post-image" src="images/post-vangogh.jpg" />
        <section class="post-footer">
          <img class="social-icon" src="images/icon-heart.png"/>
          <img class="social-icon" src="images/icon-comment.png"/>
          <img class="social-icon" src="images/icon-dm.png" />
          <p class="likes">12,502 likes</p>
        </section>
        
        </div>
    </section>
  </body>
</html>
